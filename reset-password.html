<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重設密碼｜成大教科書預訂</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page active auth-page">
      <div class="auth-card">
        <div class="brand-block">
          <span class="brand-icon large" aria-hidden="true">成</span>
          <h1>重設密碼</h1>
        </div>

        <div id="statusBanner" class="status-banner" role="status" aria-live="polite" hidden></div>

        <form id="resetForm" class="auth-form" novalidate hidden>
          <div class="field-block">
            <label for="password">新密碼</label>
            <input id="password" type="password" autocomplete="new-password" minlength="8" required />
            <p class="hint">至少 8 個字元。</p>
          </div>
          <div class="field-block">
            <label for="confirm">再次輸入新密碼</label>
            <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <button id="resetButton" class="primary-button" type="submit">更新密碼</button>
        </form>

        <a id="backToLogin" class="link-button" href="index.html">回到登入頁</a>
      </div>
    </main>

    <script type="module" src="js/reset-password.js"></script>
  </body>
</html>
