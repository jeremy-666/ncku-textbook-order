<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>預訂表單｜成大教科書預訂</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page active form-page">
      <header class="topbar">
        <a class="mini-brand" href="selection.html"><span class="brand-icon">成</span><span class="brand-copy">成大學生會 × 麗文書局<br />教科書預訂</span></a>
        <button class="link-button" type="button" data-signout>登出</button>
      </header>
      <div class="content-wrap form-wrap">
        <p class="eyebrow">教科書預訂</p>
        <h2 id="formTitle">載入中…</h2>
        <p id="formDescription" class="muted"></p>

        <div id="statusBanner" class="status-banner" role="status" aria-live="polite" hidden></div>

        <form id="orderForm" class="selection-card" novalidate hidden>
          <div id="fieldContainer"></div>
          <div class="button-row">
            <button id="saveDraftButton" class="ghost-button" type="button">儲存草稿</button>
            <button id="submitButton" class="primary-button" type="submit">送出預訂</button>
          </div>
        </form>
      </div>
    </main>

    <script type="module" src="js/form.js"></script>
    <script src="availability.js"></script>
  </body>
</html>
