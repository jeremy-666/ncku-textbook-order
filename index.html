</html><!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入｜成大教科書預訂</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page active auth-page">
      <div class="auth-card">
        <div class="brand-block">
          <span class="brand-icon large" aria-hidden="true">成</span>
          <h1>成大學生會 × 麗文書局<br />教科書預訂</h1>
        </div>

        <p class="auth-hint">成大學生請使用 gs.ncku.edu.tw Google 帳號登入</p>

        <div id="statusBanner" class="status-banner" role="status" aria-live="polite" hidden></div>

        <div class="google-block">
          <div id="googleButton" class="google-button-slot"></div>
          <p id="googleFallback" class="hint" hidden>Google 登入尚未就緒。</p>
        </div>

        <div class="divider"><span>管理員或已設定密碼的帳號</span></div>

        <form id="passwordForm" class="auth-form" novalidate>
          <div class="field-block">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="field-block">
            <label for="password">密碼</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button id="loginButton" class="primary-button" type="submit">登入</button>
        </form>

        <button id="forgotPassword" class="link-button" type="button">忘記密碼？</button>
      </div>

      <div id="pageLoader" class="page-loader" aria-hidden="true"><span class="spinner"></span></div>
    </main>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
