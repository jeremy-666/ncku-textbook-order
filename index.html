  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page active auth-page">
    <div class="auth-card">
      <div class="brand-block">
        <span class="brand-icon large" aria-hidden="true">成</span>
        <h1>成大學生會 × 麗文書局<br />教科書預訂</h1>

    <div id="pageLoader" class="page-loader" aria-hidden="true"><span class="spinner"></span></div>
